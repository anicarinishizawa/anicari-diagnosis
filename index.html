<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動物×キャリア診断 | AniCari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A2E;--cream:#FFF9F0;--pop1:#FF6B9D;--pop2:#FFB347;--pop3:#7BC8A4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
header{width:100%;padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);background:white;}
.logo-mark{width:36px;height:36px;background:var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-weight:900;font-size:18px;}
.logo-sub{font-size:10px;color:rgba(26,26,46,.4);}
.prog-wrap{width:100%;height:6px;background:rgba(26,26,46,0.08);}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--pop1),var(--pop2),var(--pop3));transition:width .5s ease;}
main{width:100%;max-width:520px;padding:24px 20px 60px;flex:1;}
.step{display:none;}
.step.active{display:block;animation:pop .3s ease;}
@keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.step-badge{display:inline-block;background:var(--ink);color:white;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:14px;}
.step-title{font-family:'DM Serif Display',serif;font-size:28px;line-height:1.3;margin-bottom:6px;}
.step-sub{font-size:13px;color:rgba(26,26,46,.5);margin-bottom:22px;}
.birth-row{display:grid;grid-template-columns:2fr 1.2fr 1.2fr;gap:10px;margin-bottom:6px;}
.birth-row select{padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;color:var(--ink);appearance:none;cursor:pointer;}
.err{font-size:12px;color:var(--pop1);font-weight:700;margin-top:6px;display:none;}
.btn-primary{width:100%;padding:16px;background:var(--ink);color:white;border:none;border-radius:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;font-weight:900;cursor:pointer;margin-top:16px;}
.btn-outline{width:100%;padding:13px;background:white;color:var(--ink);border:2px solid var(--ink);border-radius:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;}
.q-top{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.q-badge{background:var(--pop1);color:white;font-size:11px;font-weight:900;padding:4px 10px;border-radius:20px;}
.q-count{font-size:12px;color:rgba(26,26,46,.4);font-weight:700;}
.q-text{font-size:16px;font-weight:700;line-height:1.65;margin-bottom:16px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{padding:14px 16px;border:2px solid rgba(26,26,46,.12);border-radius:14px;background:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:500;line-height:1.55;color:var(--ink);text-align:left;cursor:pointer;width:100%;}
.q-opt.selected{border-color:var(--pop3);background:#E8F8F1;font-weight:700;}
.nav-row{display:flex;margin-top:16px;}
.back-btn{background:none;border:none;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:rgba(26,26,46,.35);cursor:pointer;padding:0;font-weight:700;}
.result-header{text-align:center;margin-bottom:20px;}
.animal-big{font-size:72px;line-height:1;margin-bottom:8px;}
.result-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.tag{font-size:12px;font-weight:900;padding:5px 14px;border-radius:20px;border:2px solid;}
.tag-animal{background:#FFF0F6;color:#C2185B;border-color:#F48FB1;}
.tag-job{background:#F0FBF6;color:#1B5E20;border-color:#81C784;}
.diag-card{border-radius:20px;padding:22px;margin-bottom:14px;border:2px solid;}
.diag-title{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.4;margin-bottom:10px;}
.diag-body{font-size:13px;line-height:1.8;}
.guide-card{background:white;border-radius:16px;padding:16px 18px;margin-bottom:12px;border:2px solid rgba(26,26,46,.1);}
.guide-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.guide-emoji{font-size:28px;}
.guide-badge{font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;}
.badge-animal{background:#FFF0F6;color:#C2185B;}
.badge-job{background:#F0FBF6;color:#1B5E20;}
.guide-name{font-size:15px;font-weight:900;}
.section-label{font-size:10px;font-weight:900;letter-spacing:.1em;margin:10px 0 4px;text-transform:uppercase;}
.label-job{color:#1B5E20;}
.label-fit{color:#E65100;}
.guide-text{font-size:13px;line-height:1.75;color:rgba(26,26,46,.7);}
.kw-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.kw{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(26,26,46,.05);color:rgba(26,26,46,.6);border:1.5px solid rgba(26,26,46,.1);}
.loading{text-align:center;padding:48px 0;}
.paw-anim{font-size:40px;animation:pawpop 1s ease-in-out infinite alternate;}
@keyframes pawpop{from{transform:scale(.8);}to{transform:scale(1.1);}}
.loading-text{font-size:13px;color:rgba(26,26,46,.4);margin-top:12px;font-weight:700;}
.theme-pink{background:#FFF0F6;border-color:#F48FB1;color:#880E4F;}
.theme-orange{background:#FFF3E0;border-color:#FFB74D;color:#E65100;}
.theme-green{background:#F1F8E9;border-color:#AED581;color:#1B5E20;}
.theme-purple{background:#F3E5F5;border-color:#CE93D8;color:#4A148C;}
.theme-teal{background:#E0F2F1;border-color:#80CBC4;color:#004D40;}
.theme-blue{background:#E3F2FD;border-color:#90CAF9;color:#0D47A1;}
.theme-yellow{background:#FFFDE7;border-color:#FFF176;color:#F57F17;}
.theme-indigo{background:#E8EAF6;border-color:#9FA8DA;color:#1A237E;}
.theme-amber{background:#FFF8E1;border-color:#FFE082;color:#FF6F00;}
.theme-lime{background:#F9FBE7;border-color:#C5E1A5;color:#33691E;}
.theme-coral{background:#FBE9E7;border-color:#FFAB91;color:#BF360C;}
footer{width:100%;text-align:center;padding:16px;font-size:11px;color:rgba(26,26,46,.3);font-weight:700;border-top:2px solid rgba(26,26,46,.08);}
</style>
</head>
<body>
<header>
  <div class="logo-mark">🐾</div>
  <div><div class="logo-text">AniCari</div><div class="logo-sub">動物×キャリア診断</div></div>
</header>
<div class="prog-wrap"><div class="prog-bar" id="bar" style="width:0%"></div></div>
<main>
  <div class="step active" id="s1">
    <div class="step-badge">🌟 STEP 1 OF 3 — 動物占い</div>
    <h1 class="step-title">生年月日を<br>入力してください</h1>
    <p class="step-sub">動物占いであなたの動物タイプを判定します🐾</p>
    <div class="birth-row">
      <select id="by"><option value="">年を選択</option></select>
      <select id="bm"><option value="">月</option></select>
      <select id="bd"><option value="">日</option></select>
    </div>
    <div class="err" id="derr">生年月日をすべて選択してください！</div>
    <button class="btn-primary" onclick="startQuiz()">🐾 動物を判定して診断へ →</button>
  </div>
  <div class="step" id="sq">
    <div class="q-top">
      <span class="q-badge" id="qbadge">Q1</span>
      <span class="q-count" id="qcount">1 / 10</span>
    </div>
    <p class="q-text" id="qtxt"></p>
    <div class="q-opts" id="qopts"></div>
    <div class="nav-row"><button class="back-btn" onclick="prevQ()">← 戻る</button></div>
  </div>
  <div class="step" id="sr">
    <div id="ldg" class="loading">
      <div class="paw-anim">🐾</div>
      <p class="loading-text">診断中...</p>
    </div>
    <div id="rarea" style="display:none">
      <div class="result-header">
        <div class="animal-big" id="r-emoji"></div>
        <div class="result-tags">
          <span class="tag tag-animal" id="rtag-a"></span>
          <span class="tag tag-job" id="rtag-j"></span>
        </div>
      </div>
      <div class="diag-card" id="diag-card">
        <p class="diag-title" id="rtitle"></p>
        <p class="diag-body" id="rbody"></p>
      </div>
      <div class="guide-card">
        <div class="guide-header">
          <div class="guide-emoji" id="g-emoji"></div>
          <div>
            <div class="guide-badge badge-animal">🐾 動物タイプ</div>
            <div class="guide-name" id="g-aname"></div>
          </div>
        </div>
        <p class="guide-text" id="g-adesc"></p>
        <div class="kw-row" id="g-akw"></div>
      </div>
      <div class="guide-card">
        <div class="guide-header">
          <div class="guide-emoji">💼</div>
          <div>
            <div class="guide-badge badge-job">職種解説</div>
            <div class="guide-name" id="g-jname"></div>
          </div>
        </div>
        <p class="section-label label-job">仕事内容</p>
        <p class="guide-text" id="g-jdesc"></p>
        <p class="section-label label-fit">向いている人</p>
        <p class="guide-text" id="g-jfit"></p>
        <div class="kw-row" id="g-jkw"></div>
      </div>
      <button class="btn-outline" onclick="restart()">🔄 もう一度診断する</button>
    </div>
  </div>
</main>
<footer>© 2026 AniCari — 動物×キャリア診断</footer>
<script>
const ANIMAL_THEMES={'チーター':{emoji:'🐆',theme:'theme-orange'},'たぬき':{emoji:'🦝',theme:'theme-amber'},'猿':{emoji:'🐵',theme:'theme-yellow'},'コアラ':{emoji:'🐨',theme:'theme-teal'},'黒ひょう':{emoji:'🐈',theme:'theme-indigo'},'虎':{emoji:'🐯',theme:'theme-orange'},'こじか':{emoji:'🦌',theme:'theme-green'},'ゾウ':{emoji:'🐘',theme:'theme-blue'},'狼':{emoji:'🐺',theme:'theme-purple'},'ひつじ':{emoji:'🐑',theme:'theme-lime'},'ペガサス':{emoji:'🦄',theme:'theme-pink'},'ライオン':{emoji:'🦁',theme:'theme-coral'}};

const ANIMAL_GUIDE={'チーター':{desc:'直感的な判断力と実行力で周囲を引っ張るリーダー気質。計画より行動を優先し、プレッシャーの中で本領を発揮するタイプ。感情より論理で動き、チームを結果に導くことに喜びを感じる。変化を恐れず、むしろ変化の中でエネルギーが増す挑戦者。',kw:['行動力','決断力','スピード','挑戦']},'たぬき':{desc:'場の空気を読む天才で、相手に合わせて自分を柔軟に変えられる社交派。感情的な知性が高く、人の気持ちを敏感に察知する。調和を大切にしながらも、明るさで周囲を前向きにするムードメーカー。',kw:['社交的','愛嬌','柔軟性','協調性']},'猿':{desc:'知的好奇心が旺盛で、何でも器用にこなすマルチプレイヤー。論理的思考と直感を兼ね備え、複数の視点から物事を分析できる。ユーモアで場を盛り上げながら、深いところでは鋭い洞察を持つエンターテイナー。',kw:['好奇心旺盛','器用','ユーモア','多才']},'コアラ':{desc:'穏やかで安定感があり、じっくりと物事に向き合う職人気質。感覚より論理、スピードより正確さを重視する。こだわりが強く、自分の世界観とペースを大切にする内向型の深みある存在。',kw:['安定感','信頼','こだわり','職人気質']},'黒ひょう':{desc:'クールで独自のセンスを持つ個性派。直感と審美眼で本質を見抜き、自分の美学を貫く。ひとりで深く集中することを好み、感情を内に秘めながら独創的な世界を創り上げるアーティスト的な存在。',kw:['個性的','直感力','審美眼','集中力']},'虎':{desc:'情熱的でエネルギッシュ。強い意志と行動力で目標に向かって突き進む。仲間を守る熱い心と、困難でも諦めない粘り強さを持つ。感情豊かで、その熱量が周囲を巻き込んでいくリーダー気質。',kw:['情熱','推進力','強さ','リーダー']},'こじか':{desc:'繊細で感受性が豊か。人や動物の気持ちに敏感で、共感力が極めて高い。論理より感情、スピードより丁寧さを大切にする。純粋さと思いやりで周囲から自然と愛される、温かみある存在。',kw:['繊細','共感力','思いやり','丁寧']},'ゾウ':{desc:'記憶力と洞察力に優れた知性派。感情より論理、直感より経験と知識を重視する。長期的な視点で物事を考え、どっしりとした安定感で周囲に安心感を与える頼れる存在。',kw:['知性','洞察力','安心感','長期思考']},'狼':{desc:'独立心が強く、自分の信念と価値観を軸に動く一匹狼タイプ。感情を表に出さず、内側に深い忠誠心と情熱を持つ。孤独を恐れず、自分の道を歩む強さと、仲間への深い絆を兼ね備える。',kw:['独立心','忠誠心','信念','粘り強さ']},'ひつじ':{desc:'温かみと優しさで周囲に癒しをもたらす存在。感情的な知性が高く、周囲の気持ちに自然と寄り添う。争いを好まず、協調性を大切にしながら、人のために献身的に動ける平和主義者。',kw:['温かみ','協調性','献身','平和主義']},'ペガサス':{desc:'夢と理想を高く持つ直感型のロマンチスト。論理より感性、現実より可能性を重視する。自由を愛し、想像力と独創性で誰も見たことのない世界を切り拓く。理想への情熱が行動の原動力。',kw:['理想主義','自由','独創性','感性']},'ライオン':{desc:'堂々とした存在感と強いカリスマ性を持つ王様タイプ。プライドと責任感が行動を支え、周囲を自然と引っ張る統率力がある。感情を適切にコントロールしながら、大きな目標に向けてチームを動かすリーダー。',kw:['カリスマ','責任感','プライド','統率力']}};

let animal='',curQ=0,ans=[],sc={};

function setBar(p){document.getElementById('bar').style.width=p+'%';}
function show(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function startQuiz(){
  const y=parseInt(document.getElementById('by').value);
  const m=parseInt(document.getElementById('bm').value);
  const d=parseInt(document.getElementById('bd').value);
  if(!y||!m||!d){document.getElementById('derr').style.display='block';return;}
  document.getElementById('derr').style.display='none';
  animal=calcAnimal(y,m,d);
  show('sq');setBar(5);loadQ(0);
}
function loadQ(i){
  curQ=i;
  document.getElementById('qbadge').textContent='Q'+(i+1);
  document.getElementById('qcount').textContent=(i+1)+' / '+QS.length;
  document.getElementById('qtxt').textContent=QS[i].q;
  setBar(5+Math.round((i/QS.length)*85));
  const el=document.getElementById('qopts');el.innerHTML='';
  QS[i].opts.forEach((opt,j)=>{
    const btn=document.createElement('button');
    btn.className='q-opt'+(ans[i]===j?' selected':'');
    btn.textContent=opt.t;
    btn.onclick=()=>pick(i,j);
    el.appendChild(btn);
  });
}
function pick(qi,ai){
  if(ans[qi]!==undefined)sc[QS[qi].opts[ans[qi]].j]-=10;
  ans[qi]=ai;sc[QS[qi].opts[ai].j]+=10;
  document.querySelectorAll('.q-opt').forEach((b,j)=>b.classList.toggle('selected',j===ai));
  setTimeout(()=>{if(qi<QS.length-1)loadQ(qi+1);else showResult();},280);
}
function prevQ(){if(curQ>0)loadQ(curQ-1);else{show('s1');setBar(0);}}

    document.getElementById('g-emoji').textContent=at.emoji;
    document.getElementById('g-aname').textContent=animal;
    document.getElementById('g-adesc').textContent=ag.desc;
    const akw=document.getElementById('g-akw');akw.innerHTML='';
    ag.kw.forEach(k=>{const s=document.createElement('span');s.className='kw';s.textContent=k;akw.appendChild(s);});
    const jg=JOB_GUIDE[topJob]||{desc:'',fit:'',kw:[]};
    document.getElementById('g-jname').textContent=topJob;
    document.getElementById('g-jdesc').textContent=jg.desc;
    document.getElementById('g-jfit').textContent=jg.fit;
    const jkw=document.getElementById('g-jkw');jkw.innerHTML='';
    jg.kw.forEach(k=>{const s=document.createElement('span');s.className='kw';s.textContent=k;jkw.appendChild(s);});
    document.getElementById('ldg').style.display='none';
    document.getElementById('rarea').style.display='block';
  },800);
}
function restart(){
  ans=[];JOBS.forEach(j=>sc[j]=0);animal='';curQ=0;
  ['by','bm','bd'].forEach(id=>document.getElementById(id).value='');
  show('s1');setBar(0);
}
</script>
